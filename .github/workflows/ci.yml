name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install MLflow
        run: pip install mlflow==2.19.0

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Docker Model
        env:
          MLFLOW_TRACKING_URI: "https://dagshub.com/VevaR02/Shipment-MLOps" 
        run: |
          mlflow models build-docker -m "runs:/a577762d5619442baddc818122045944/shipment_model" -n ${{ secrets.DOCKER_USERNAME }}/smart-shipment-model:latest
          
          # Push ke Docker Hub
          docker push ${{ secrets.DOCKER_USERNAME }}/smart-shipment-model:latest